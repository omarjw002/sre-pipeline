name: Docker CI Pipeline

on:
  push:
    branches: [ "main" ] # سيبدأ العمل فوراً عند أي حفظ في الفرع الرئيسي

jobs:
  build-and-test:
    runs-on: ubuntu-latest # سيقوم GitHub بحجز سيرفر أوبونتو خاص لنا

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3 # خطوة جلب الكود من المستودع للسيرفر

      - name: Build Docker Image
        run: docker build -t my_test_image . # خطوة اختبار بناء القالب
